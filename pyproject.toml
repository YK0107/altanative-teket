[project]
name = "teket-alt"
version = "0.1.0"
description = "1団体専用チケット販売システム（backend / tools）"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.3",
    "fastapi>=0.163.0",
    "mangum>=0.22.0",
    "pyjwt>=2.15.1",
    "segno>=1.6.6",
    "stripe>=17.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "moto>=5.2.5",
    "httpx>=0.28.1",
]
tools = ["pdfplumber"]

[tool.uv]
default-groups = ["dev", "tools"]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["backend", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # 全角文字を含む文字列・コメントを許可

[tool.ty.src]
include = ["backend", "tools"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
