name: Deploy

# main へのマージで本番に反映する。
# リポジトリ変数 AWS_DEPLOY_ROLE_ARN / TF_STATE_BUCKET が未設定の間（AWS 未準備）はスキップ。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      TF_IN_AUTOMATION: "1"
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
      TF_VAR_mail_from: ${{ vars.MAIL_FROM }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_VAR_event_id: ${{ vars.EVENT_ID || 'evt_2027' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - name: Test backend
        run: uv sync --locked && uv run pytest -q
      - name: Build Lambda package
        run: ./backend/build_lambda.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_MODE: live
        run: npm ci && npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -input=false -auto-approve
          echo "BUCKET=$(terraform output -raw site_bucket)" >> "$GITHUB_ENV"
          echo "DIST_ID=$(terraform output -raw distribution_id)" >> "$GITHUB_ENV"

      - name: Upload frontend
        run: |
          # ハッシュ付きのアセットは長期キャッシュ、index.html 等は毎回確認
          aws s3 sync frontend/dist "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html" "/" >/dev/null
