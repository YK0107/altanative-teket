name: Pages (mock preview)

# 見た目確認用。モックモード（ブラウザ内のダミーデータ、AWS/Stripe に接続しない）で GitHub Pages に配信する。
# 事前に Settings → Pages → Source を「GitHub Actions」にしておくこと。
on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  # デプロイ途中で打ち切らない（公式 starter workflow と同じ）
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (mock)
        run: npm run build
        env:
          VITE_API_MODE: mock
          VITE_BASE: /${{ github.event.repository.name }}/
      # BrowserRouter の直リンク・再読み込み対策（Pages は未知のパスで 404.html を返す）
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
